    <script>
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && !desc.writable && !desc.set) {
            var _origFetch = window.fetch;
            var _currentFetch = _origFetch ? _origFetch.bind(window) : undefined;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _currentFetch; },
                set: function(newFetch) { _currentFetch = newFetch; },
                configurable: true,
                enumerable: true
              });
            } catch (innerErr) {}
          }
        } catch (e) {}
      })();
    </script>
